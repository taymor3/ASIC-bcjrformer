<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720"><rect width="1500" height="720" fill="white"/><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1678be"/></marker><marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c62828"/></marker><marker id="unit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#438b35"/></marker><marker id="select" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b68112"/></marker><marker id="reg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#75509e"/></marker><marker id="frame" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#374151"/></marker></defs><polyline points="195,137 320,137" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="425,137 550,137" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="655,137 780,137" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="885,137 1010,137" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><text fill="#263442" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><tspan x="750" y="37.5">Stage 5 — recoverable empty-position error</tspan></text><ellipse cx="142.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="142.5" y="131.5">Empty Cₙ</tspan><tspan x="142.5" y="153.5">detected</tspan></text><ellipse cx="372.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="372.5" y="131.5">Stop /</tspan><tspan x="372.5" y="153.5">drain</tspan></text><ellipse cx="602.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="602.5" y="131.5">Invalidate</tspan><tspan x="602.5" y="153.5">whole frame</tspan></text><ellipse cx="832.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="832.5" y="142.5">Hold error</tspan></text><ellipse cx="1062.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1062.5" y="142.5">Idle</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="629.5">Report EMPTY_POSITION and save the failing n. Do not divide by zero, output zeros, or emit partial logits.</tspan><tspan x="750" y="651.5">Do not erase memory: clear its frame-valid flag. After error acceptance the next frame may start without hard reset.</tspan><tspan x="750" y="673.5">Other hardware/protocol errors still follow the fatal stop/drain/report/reset policy.</tspan><tspan x="750" y="695.5">A Read / Write state uses the shared transaction FSM. A Run state waits for child completion. Stalls never advance an index.</tspan></text></svg>
