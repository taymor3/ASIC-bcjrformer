troke-dasharray="6 5"/><polyline points="445,337 501.6666666666667,337" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="888.3333333333334,175 888.3333333333334,290" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" marker-start="url(#control)" stroke-dasharray="6 5"/><polyline points="721.6666666666667,337 778.3333333333334,337" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="1165,175 1165,290" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" marker-start="url(#control)" stroke-dasharray="6 5"/><polyline points="1275,337 1320,337" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="1230,175 1260,175 1260,512 1210,512" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" marker-start="url(#control)" stroke-dasharray="6 5"/><polyline points="335,385 335,480" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)" marker-start="url(#data)"/><polyline points="611.6666666666667,385 611.6666666666667,480" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)" marker-start="url(#data)"/><polyline points="888.3333333333334,385 888.3333333333334,480" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)" marker-start="url(#data)"/><polyline points="1165,385 1165,480" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)" marker-start="url(#data)"/><polyline points="305,385 305,435 1135,435 1135,385" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><text fill="#263442" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><tspan x="750" y="37.5">Sum/count logic — owned by Stage 5</tspan></text><text fill="#374151" font-family="Arial,sans-serif" font-size="16" text-anchor="start"><tspan x="202" y="98">Sum/count logic — owned by Stage 5</tspan></text><rect x="220" y="125" width="1030" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="155">Sum/count logic controller</tspan></text><rect x="20" y="125" width="140" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="90" y="155">Start / command</tspan></text><rect x="1320" y="125" width="160" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="155">Done / error</tspan></text><rect x="225" y="290" width="220" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="335" y="331.5">NOT mask</tspan><tspan x="335" y="353.5">valid bit</tspan></text><rect x="501.6666666666667" y="290" width="220" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="611.6666666666667" y="331.5">Select add or skip</tspan><tspan x="611.6666666666667" y="353.5">logit / zero</tspan></text><rect x="778.3333333333334" y="290" width="220" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="888.3333333333334" y="320.5">Signed sum adder</tspan><tspan x="888.3333333333334" y="342.5">Sₙ ← Sₙ + z</tspan><tspan x="888.3333333333334" y="364.5">only if valid</tspan></text><rect x="1055" y="290" width="220" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1165" y="320.5">Integer count adder</tspan><tspan x="1165" y="342.5">Cₙ ← Cₙ + 1</tspan><tspan x="1165" y="364.5">only if valid</tspan></text><rect x="20" y="300" width="145" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="92.5" y="342.5">Stored input</tspan></text><rect x="1320" y="300" width="160" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="342.5">Stored output</tspan></text><rect x="260" y="480" width="950" height="65" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="517.5">Memory access: mask_base + mN+n / logit_base + mN+n; increment by N as m advances</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">A valid position enables BOTH sum and count. A padded position enables neither; never count only wholly unpadded reads.</tspan><tspan x="750" y="662.5">Sₙ starts at zero with enough signed width for M logits. Cₙ starts at zero and must represent 0..M exactly.</tspan><tspan x="750" y="684.5">No feature quantization applies to count or addresses. The controller advances m after the selected contribution completes.</tspan></text></svg>
