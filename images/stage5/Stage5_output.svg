/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="92.5" y="342.5">Stored input</tspan></text><rect x="1320" y="300" width="160" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="342.5">Stored output</tspan></text><rect x="260" y="480" width="950" height="65" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="517.5">Memory access: final buffered logits[N]; invalid frames have no readout permission</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">External ready/valid transfer starts only after Stage 5 successful completion. Failure cannot leak earlier buffered positions.</tspan><tspan x="750" y="662.5">Hold value/index/last stable while ready is low. Advance n only on valid AND ready. Do not discard or duplicate results.</tspan><tspan x="750" y="684.5">After N accepted logits, hold frame completion until accepted. Read-back stalls use the same transaction interface.</tspan></text></svg>
