1062,190 1062,200 602,200 602,190" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><text fill="#263442" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><tspan x="750" y="37.5">Output transfer controller</tspan></text><ellipse cx="142.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="142.5" y="142.5">Idle</tspan></text><ellipse cx="372.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="372.5" y="131.5">Check valid</tspan><tspan x="372.5" y="153.5">n = 0</tspan></text><ellipse cx="602.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="602.5" y="142.5">Read logit</tspan></text><ellipse cx="832.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="832.5" y="142.5">Hold output</tspan></text><ellipse cx="1062.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1062.5" y="131.5">Next</tspan><tspan x="1062.5" y="153.5">position</tspan></text><ellipse cx="1292.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1292.5" y="120.5">Report</tspan><tspan x="1292.5" y="142.5">frame</tspan><tspan x="1292.5" y="164.5">completion</tspan></text><ellipse cx="1292.5" cy="322.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1292.5" y="327.5">Done</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">Hold output waits for receiver acceptance; last is true only for n=N−1. Completion follows the last accepted output.</tspan><tspan x="750" y="662.5">No new frame may replace the output bank while readout or completion is pending.</tspan><tspan x="750" y="684.5">A Read / Write state uses the shared transaction FSM. A Run state waits for child completion. Stalls never advance an index.</tspan></text><text x="630" y="217" fill="#c62828" font-family="Arial" font-size="13">more positions</text></svg>
