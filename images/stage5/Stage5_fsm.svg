1240,322 1115,322" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1010,322 885,322" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="780,322 655,322" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="550,322 425,322" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="320,322 195,322" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="142,375 142,455" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1292,190 1292,200 832,200 832,190" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="372,375 372,393 46,393 46,60 602,60 602,85" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1292,375 1445,375 1445,465 1300,465 1300,495" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><text fill="#263442" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><tspan x="750" y="37.5">Stage 5 controller</tspan></text><ellipse cx="142.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="142.5" y="142.5">Idle</tspan></text><ellipse cx="372.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="372.5" y="142.5">n = 0</tspan></text><ellipse cx="602.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="602.5" y="131.5">Clear Sₙ,Cₙ</tspan><tspan x="602.5" y="153.5">m = 0</tspan></text><ellipse cx="832.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="832.5" y="142.5">Read mask</tspan></text><ellipse cx="1062.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1062.5" y="120.5">Read / add</tspan><tspan x="1062.5" y="142.5">z</tspan><tspan x="1062.5" y="164.5">if valid</tspan></text><ellipse cx="1292.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1292.5" y="142.5">Next read</tspan></text><ellipse cx="1292.5" cy="322.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1292.5" y="327.5">Check Cₙ</tspan></text><ellipse cx="1062.5" cy="322.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1062.5" y="316.5">Run</tspan><tspan x="1062.5" y="338.5">reciprocal</tspan></text><ellipse cx="832.5" cy="322.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="832.5" y="327.5">Run scale</tspan></text><ellipse cx="602.5" cy="322.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="602.5" y="305.5">Write</tspan><tspan x="602.5" y="327.5">buffered</tspan><tspan x="602.5" y="349.5">logit</tspan></text><ellipse cx="372.5" cy="322.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="372.5" y="316.5">Next</tspan><tspan x="372.5" y="338.5">position</tspan></text><ellipse cx="142.5" cy="322.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="142.5" y="316.5">Mark frame</tspan><tspan x="142.5" y="338.5">valid</tspan></text><ellipse cx="142.5" cy="507.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="142.5" y="512.5">Done</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">Masked position skips logit read/add/count. Cₙ=0 branches to Empty-position handling, never to reciprocal.</tspan><tspan x="750" y="662.5">No output is released until all N logits are written and the frame is valid. M=1 uses the same mask-aware rule.</tspan><tspan x="750" y="684.5">A Read / Write state uses the shared transaction FSM. A Run state waits for child completion. Stalls never advance an index.</tspan></text><rect x="1170" y="495" width="260" height="65" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1300" y="532.5">Cₙ = 0 → empty-frame handler</tspan></text><text x="860" y="217" fill="#c62828" font-family="Arial" font-size="13">more reads</text><text x="60" y="410" fill="#c62828" font-family="Arial" font-size="13">more positions</text><text x="1280" y="455" fill="#c62828" font-family="Arial" font-size="13">zero count</text></svg>
