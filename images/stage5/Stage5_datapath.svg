troke-dasharray="6 5"/><polyline points="445,337 501.6666666666667,337" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="888.3333333333334,175 888.3333333333334,290" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" marker-start="url(#control)" stroke-dasharray="6 5"/><polyline points="721.6666666666667,337 778.3333333333334,337" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="1165,175 1165,290" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" marker-start="url(#control)" stroke-dasharray="6 5"/><polyline points="998.3333333333334,337 1055,337" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="1275,337 1320,337" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="1230,175 1260,175 1260,512 1210,512" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" marker-start="url(#control)" stroke-dasharray="6 5"/><polyline points="335,385 335,480" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)" marker-start="url(#data)"/><polyline points="611.6666666666667,385 611.6666666666667,480" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)" marker-start="url(#data)"/><polyline points="888.3333333333334,385 888.3333333333334,480" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)" marker-start="url(#data)"/><polyline points="1165,385 1165,480" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)" marker-start="url(#data)"/><text fill="#263442" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><tspan x="750" y="37.5">Stage 5 — Read aggregation</tspan></text><text fill="#374151" font-family="Arial,sans-serif" font-size="16" text-anchor="start"><tspan x="202" y="98">Stage 5 — Read aggregation</tspan></text><rect x="220" y="125" width="1030" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="155">Stage 5 controller</tspan></text><rect x="20" y="125" width="140" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="90" y="155">Start / command</tspan></text><rect x="1320" y="125" width="160" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="155">Done / error</tspan></text><rect x="225" y="290" width="220" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="335" y="331.5">Mask check</tspan><tspan x="335" y="353.5">Sum / count</tspan></text><rect x="501.6666666666667" y="290" width="220" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="611.6666666666667" y="331.5">Check Cₙ</tspan><tspan x="611.6666666666667" y="353.5">RECIP black box</tspan></text><rect x="778.3333333333334" y="290" width="220" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="888.3333333333334" y="331.5">Multiply Sₙ / Cₙ</tspan><tspan x="888.3333333333334" y="353.5">Convert / store</tspan></text><rect x="1055" y="290" width="220" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1165" y="331.5">Frame-valid check</tspan><tspan x="1165" y="353.5">Release output</tspan></text><rect x="20" y="300" width="145" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="92.5" y="331.5">Read logits z</tspan><tspan x="92.5" y="353.5">and padding mask</tspan></text><rect x="1320" y="300" width="160" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="331.5">Final logits [N]</tspan><tspan x="1400" y="353.5">only if frame valid</tspan></text><rect x="260" y="480" width="950" height="65" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="517.5">Memory access: read logits[M,N] / padding mask[M,N] / buffered final logits[N]</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">For each position n: v[m,n] = NOT mask[m,n]; Sₙ = Σₘ v[m,n]·z[m,n]; Cₙ = Σₘ v[m,n].</tspan><tspan x="750" y="662.5">If Cₙ &gt; 0: logit[n] = QACT(Sₙ × RECIP(Cₙ)). Count and sum always use the SAME valid reads for that position.</tspan><tspan x="750" y="684.5">If any Cₙ = 0: invalidate the whole output frame, report EMPTY_POSITION+n, then return to idle without reset.</tspan></text></svg>
