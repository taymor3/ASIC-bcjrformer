1240,322 1115,322" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1010,322 885,322" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1292,375 1292,385 40,385 40,60 832,60 832,85" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><text fill="#263442" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><tspan x="750" y="37.5">Self-attention controller</tspan></text><ellipse cx="142.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="142.5" y="142.5">Idle</tspan></text><ellipse cx="372.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="372.5" y="142.5">Run Q/K/V</tspan></text><ellipse cx="602.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="602.5" y="131.5">Init head /</tspan><tspan x="602.5" y="153.5">query</tspan></text><ellipse cx="832.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="832.5" y="131.5">Run score</tspan><tspan x="832.5" y="153.5">row</tspan></text><ellipse cx="1062.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1062.5" y="142.5">Run softmax</tspan></text><ellipse cx="1292.5" cy="137.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1292.5" y="120.5">Run</tspan><tspan x="1292.5" y="142.5">weighted</tspan><tspan x="1292.5" y="164.5">values</tspan></text><ellipse cx="1292.5" cy="322.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1292.5" y="305.5">Next query</tspan><tspan x="1292.5" y="327.5">/</tspan><tspan x="1292.5" y="349.5">head</tspan></text><ellipse cx="1062.5" cy="322.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1062.5" y="316.5">Run output</tspan><tspan x="1062.5" y="338.5">projection</tspan></text><ellipse cx="832.5" cy="322.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="832.5" y="327.5">Done</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">Query i advances within head h; after the last query, advance h and reset i. After all H heads, project every Z token.</tspan><tspan x="750" y="662.5">For a padded query the softmax child writes uniform probabilities; the baseline does not mask key columns.</tspan><tspan x="750" y="684.5">A Read / Write state uses the shared transaction FSM. A Run state waits for child completion. Stalls never advance an index.</tspan></text><text x="60" y="402" fill="#c62828" font-family="Arial" font-size="13">more queries / heads</text></svg>
