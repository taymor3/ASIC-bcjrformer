<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720"><rect width="1500" height="720" fill="white"/><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1678be"/></marker><marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c62828"/></marker><marker id="unit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#438b35"/></marker><marker id="select" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b68112"/></marker><marker id="reg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#75509e"/></marker><marker id="frame" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#374151"/></marker></defs><rect x="190" y="75" width="1090" height="505" fill="white" stroke="#374151" stroke-width="2" stroke-dasharray="7 5"/><polyline points="160,150 220,150" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1250,150 1320,150" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="165,337 225,337" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="335,175 335,290" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" marker-start="url(#control)" stroke-dasharray="6 5"/><polyline points="445,337 1320,337" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="1230,175 1260,175 1260,512 1210,512" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" marker-start="url(#control)" stroke-dasharray="6 5"/><polyline points="335,385 335,480" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)" marker-start="url(#data)"/><text fill="#263442" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><tspan x="750" y="37.5">Stage 3 — Encoder layers</tspan></text><text fill="#374151" font-family="Arial,sans-serif" font-size="16" text-anchor="start"><tspan x="202" y="98">Stage 3 — Encoder layers</tspan></text><rect x="220" y="125" width="1030" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="155">Stage 3 controller</tspan></text><rect x="20" y="125" width="140" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="90" y="155">Start / command</tspan></text><rect x="1320" y="125" width="160" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="155">Done / error</tspan></text><rect x="225" y="290" width="220" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="335" y="320.5">One encoder layer</tspan><tspan x="335" y="342.5">Repeated K times</tspan><tspan x="335" y="364.5">Layer diagram</tspan></text><rect x="20" y="300" width="145" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="92.5" y="331.5">Stage 2 values</tspan><tspan x="92.5" y="353.5">X⁽⁰⁾ [L,D]</tspan></text><rect x="1320" y="300" width="160" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="331.5">Stage 4 input</tspan><tspan x="1400" y="353.5">X⁽ᴷ⁾ [L,D]</tspan></text><rect x="260" y="480" width="950" height="65" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="517.5">Memory access: working X / padding mask / selected layer parameters / layer temporary results</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">Input X⁽⁰⁾ [L,D]; output X⁽ᴷ⁾ [L,D]. K is the number of layers, not a trained weight.</tspan><tspan x="750" y="662.5">One hardware layer is reused with distinct parameter sets. k advances only after the whole layer finishes.</tspan><tspan x="750" y="684.5">The mask remains available for every layer. Child controllers run one at a time; fatal errors block Stage 4.</tspan></text></svg>
