ints="840.9000000000001,385 840.9000000000001,480" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)" marker-start="url(#data)"/><polyline points="1022.7,385 1022.7,480" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)" marker-start="url(#data)"/><polyline points="1204.5,385 1204.5,480" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)" marker-start="url(#data)"/><polyline points="165,325 185,325 185,245 628.6,245 628.6,290" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="648.6,385 648.6,430 1194,430 1194,385" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><text fill="#263442" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><tspan x="750" y="37.5">Encoder layer — reused for every k</tspan></text><text fill="#374151" font-family="Arial,sans-serif" font-size="16" text-anchor="start"><tspan x="202" y="98">Encoder layer — reused for every k</tspan></text><rect x="220" y="125" width="1030" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="155">Encoder layer controller</tspan></text><rect x="20" y="125" width="140" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="90" y="155">Start / command</tspan></text><rect x="1320" y="125" width="160" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="155">Done / error</tspan></text><rect x="225" y="290" width="141" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="295.5" y="320.5">Normalization 1</tspan><tspan x="295.5" y="342.5">Shared unit</tspan><tspan x="295.5" y="364.5">Stage 1 detail</tspan></text><rect x="406.8" y="290" width="141" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="477.3" y="331.5">Self-attention</tspan><tspan x="477.3" y="353.5">Own controller</tspan></text><rect x="588.6" y="290" width="141" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="659.1" y="331.5">Residual add 1</tspan><tspan x="659.1" y="353.5">Shared unit</tspan></text><rect x="770.4000000000001" y="290" width="141" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="840.9000000000001" y="320.5">Normalization 2</tspan><tspan x="840.9000000000001" y="342.5">Shared unit</tspan><tspan x="840.9000000000001" y="364.5">Stage 1 detail</tspan></text><rect x="952.2" y="290" width="141" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1022.7" y="331.5">FFN</tspan><tspan x="1022.7" y="353.5">Own controller</tspan></text><rect x="1134" y="290" width="141" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1204.5" y="331.5">Residual add 2</tspan><tspan x="1204.5" y="353.5">Shared unit</tspan></text><rect x="20" y="300" width="145" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="92.5" y="342.5">Stored input</tspan></text><rect x="1320" y="300" width="160" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="342.5">Stored output</tspan></text><rect x="260" y="480" width="950" height="65" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="517.5">Memory access: X / U / Q,K,V / row scratch / Z,O / FFN scratch / weights / mask</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">U = LN1(X); O = Attention(U); R = QACT(X + O); V = LN2(R); F = FFN(V); next X = QACT(R + F).</tspan><tspan x="750" y="662.5">LN1 and LN2 reuse one engine with different learned gamma/beta. Residual additions reuse one element-wise controller.</tspan><tspan x="750" y="684.5">Original X is preserved through attention; R is preserved through FFN. No inference dropout.</tspan></text></svg>
