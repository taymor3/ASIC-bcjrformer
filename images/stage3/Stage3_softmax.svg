><tspan x="202" y="98">Softmax-row controller</tspan></text><rect x="220" y="125" width="1030" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="155">Softmax-row controller</tspan></text><rect x="20" y="125" width="140" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="90" y="155">Start / command</tspan></text><rect x="1320" y="125" width="160" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="155">Done / error</tspan></text><rect x="225" y="290" width="220" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="335" y="331.5">Compare / select</tspan><tspan x="335" y="353.5">row maximum</tspan></text><rect x="501.6666666666667" y="290" width="220" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="611.6666666666667" y="331.5">Subtract max</tspan><tspan x="611.6666666666667" y="353.5">EXP black box</tspan></text><rect x="778.3333333333334" y="290" width="220" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="888.3333333333334" y="331.5">Add exp values</tspan><tspan x="888.3333333333334" y="353.5">RECIP black box</tspan></text><rect x="1055" y="290" width="220" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1165" y="331.5">Multiply by 1/sum</tspan><tspan x="1165" y="353.5">Convert / write</tspan></text><rect x="20" y="300" width="145" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="92.5" y="342.5">Stored input</tspan></text><rect x="1320" y="300" width="160" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="342.5">Stored output</tspan></text><rect x="260" y="480" width="950" height="65" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="517.5">Memory access: score row / saved exponentials / probability row / query mask / 1/L constant</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">Normal row: vmax = max(s[j]); b[j] = EXP(s[j]−vmax); T = Σ b[j]; p[j] = QPROB(b[j] × RECIP(T)).</tspan><tspan x="750" y="662.5">Maximum starts from the first score, not zero. Padded query: p[j] = stored 1/L instead; no exp / reciprocal work.</tspan><tspan x="750" y="684.5">EXP and RECIP remain black boxes until range, method and error targets are chosen. T must be positive.</tspan></text><rect x="300" y="405" width="270" height="50" fill="white" stroke="#b68112" stroke-width="2"/><text fill="#b68112" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="435" y="435">Uniform selector: 1/L or normal p</tspan></text></svg>
