pan x="968.75" y="331.5">Weighted values</tspan><tspan x="968.75" y="353.5">Shared dot</tspan></text><rect x="1100" y="290" width="175" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1187.5" y="331.5">Output projection</tspan><tspan x="1187.5" y="353.5">Shared linear</tspan></text><rect x="20" y="300" width="145" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="92.5" y="342.5">Stored input</tspan></text><rect x="1320" y="300" width="160" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="342.5">Stored output</tspan></text><rect x="260" y="480" width="950" height="65" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="517.5">Memory access: U / Q,K,V / scores[L] / exponentials[L] / probabilities[L] / Z,O / mask / weights</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">Input U [L,D]; Q/K/V [L,D] are calculated, not stored trained parameters. H heads; d = D/H.</tspan><tspan x="750" y="662.5">Finish all Q, K, V first. For each head/query: score → softmax → weighted values. Then project all joined Z tokens to O.</tspan><tspan x="750" y="684.5">One score/probability row is reused only after its d weighted-value results are stored. Head joining is address layout, not copying.</tspan></text></svg>
