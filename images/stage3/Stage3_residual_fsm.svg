oke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1292.5" y="316.5">Next</tspan><tspan x="1292.5" y="338.5">feature</tspan></text><ellipse cx="1062.5" cy="322.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1062.5" y="327.5">Done</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">Operate on one D-element token. The owning layer controller handles its token loop and chooses first or second residual.</tspan><tspan x="750" y="662.5">Addition child holds result/flags until accepted. Write confirmation precedes the feature increment.</tspan><tspan x="750" y="684.5">A Read / Write state uses the shared transaction FSM. A Run state waits for child completion. Stalls never advance an index.</tspan></text><text x="60" y="402" fill="#c62828" font-family="Arial" font-size="13">more features</text></svg>
