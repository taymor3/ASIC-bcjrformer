U before attention. First residual stores all R before LN2. LN2 stores all V before FFN/residual 2 token loop.</tspan><tspan x="750" y="662.5">LN1: X→U; LN2: X(R)→U(V). Residual 1 writes X=R; residual 2 writes X=next layer output.</tspan><tspan x="750" y="684.5">A Read / Write state uses the shared transaction FSM. A Run state waits for child completion. Stalls never advance an index.</tspan></text><text x="630" y="217" fill="#c62828" font-family="Arial" font-size="13">more tokens</text><text x="1090" y="410" fill="#c62828" font-family="Arial" font-size="13">more tokens</text><text x="400" y="418" fill="#c62828" font-family="Arial" font-size="13">more tokens</text><text x="170" y="611" fill="#c62828" font-family="Arial" font-size="13">more tokens</text></svg>
