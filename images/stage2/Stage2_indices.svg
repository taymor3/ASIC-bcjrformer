<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720"><rect width="1500" height="720" fill="white"/><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1678be"/></marker><marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c62828"/></marker><marker id="unit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#438b35"/></marker><marker id="select" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b68112"/></marker><marker id="reg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#75509e"/></marker><marker id="frame" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#374151"/></marker></defs><rect x="190" y="75" width="1090" height="505" fill="white" stroke="#374151" stroke-width="2" stroke-dasharray="7 5"/><polyline points="160,150 220,150" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1250,150 1320,150" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="165,330 260,325" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="470,310 585,305" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="785,305 870,310" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="870,340 825,340 825,435 360,435 360,375" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="470,350 515,350 515,465 1260,465 1260,340 1320,340" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="680,175 680,255" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1000,175 1000,265" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><text fill="#263442" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><tspan x="750" y="37.5">Stage 2 index and address logic — controlled by the Stage 2 FSM</tspan></text><text fill="#374151" font-family="Arial,sans-serif" font-size="16" text-anchor="start"><tspan x="202" y="98">Indices and addresses</tspan></text><rect x="220" y="125" width="1030" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="155">Stage 2 controller — owns these index registers</tspan></text><rect x="20" y="125" width="140" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="90" y="155">Start / command</tspan></text><rect x="1320" y="125" width="160" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="155">Done / error</tspan></text><rect x="20" y="285" width="145" height="90" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="92.5" y="324">Initialize / advance</tspan><tspan x="92.5" y="346">after write done</tspan></text><rect x="260" y="285" width="210" height="90" fill="white" stroke="#75509e" stroke-width="2"/><text fill="#75509e" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="365" y="313">Integer registers</tspan><tspan x="365" y="335">m, n, j</tspan><tspan x="365" y="357">Xptr, Pptr, Eptr</tspan></text><rect x="585" y="255" width="200" height="100" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="685" y="288">Compare last index</tspan><tspan x="685" y="310">j = D−1</tspan><tspan x="685" y="332">n = N−1; m = M−1</tspan></text><rect x="870" y="265" width="260" height="90" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1000" y="293">Add / select</tspan><tspan x="1000" y="315">increment or wrap</tspan><tspan x="1000" y="337">next index / pointer</tspan></text><rect x="1320" y="285" width="160" height="90" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="324">Read / write</tspan><tspan x="1400" y="346">addresses</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="752.5" y="519">Addresses: Xbase + tD + j; Pbase + nD + j; Ebase + mD + j, with t = mN + n.</tspan><tspan x="752.5" y="541">These formulas explain the layout. Hardware advances pointers; no runtime multiply, divide or modulo.</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">j selects one feature; n selects a position; m selects a read slot. D = features/token, N = positions/read, M = read slots.</tspan><tspan x="750" y="662.5">Xptr advances each value. Pptr wraps after N × D values; Eptr returns to the current read row for each new position.</tspan><tspan x="750" y="684.5">These registers belong to the Stage 2 controller, not an independently scheduled child. All widths are sized for the allowed dimensions.</tspan></text></svg>
