<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720"><rect width="1500" height="720" fill="white"/><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1678be"/></marker><marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c62828"/></marker><marker id="unit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#438b35"/></marker><marker id="select" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b68112"/></marker><marker id="reg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#75509e"/></marker><marker id="frame" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#374151"/></marker></defs><rect x="190" y="75" width="1090" height="505" fill="white" stroke="#374151" stroke-width="2" stroke-dasharray="7 5"/><polyline points="160,150 220,150" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1250,150 1320,150" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="165,330 255,325" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="450,325 535,325" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="700,325 780,320" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="915,320 1040,325" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="1245,325 1320,330" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="350,175 350,280" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="615,175 615,280" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="845,175 845,280" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1140,175 1140,280" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><text fill="#263442" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><tspan x="750" y="37.5">Shared addition block — same hardware for position and read-slot additions</tspan></text><text fill="#374151" font-family="Arial,sans-serif" font-size="16" text-anchor="start"><tspan x="202" y="98">Addition block</tspan></text><rect x="220" y="125" width="1030" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="155">Addition block controller</tspan></text><rect x="20" y="125" width="140" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="90" y="155">Start / command</tspan></text><rect x="1320" y="125" width="160" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="155">Done / error</tspan></text><rect x="20" y="285" width="145" height="95" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="92.5" y="326.5">Command operands</tspan><tspan x="92.5" y="348.5">value and P or E</tspan></text><rect x="255" y="280" width="195" height="90" fill="white" stroke="#75509e" stroke-width="2"/><text fill="#75509e" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="352.5" y="319">Operand registers</tspan><tspan x="352.5" y="341">A and B</tspan></text><rect x="535" y="280" width="165" height="90" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="617.5" y="319">Sign extend</tspan><tspan x="617.5" y="341">Align fractions</tspan></text><rect x="780" y="285" width="135" height="70" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="847.5" y="314">Add</tspan><tspan x="847.5" y="336">wide sum</tspan></text><rect x="1040" y="280" width="205" height="90" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1142.5" y="319">Round / saturate</tspan><tspan x="1142.5" y="341">Page 6</tspan></text><rect x="1320" y="285" width="160" height="90" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="324">ACT result</tspan><tspan x="1400" y="346">round / sat flags</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="745" y="484">a = QACT(e + P[n,j])      then      X⁽⁰⁾ = QACT(a + E[m,j])</tspan><tspan x="745" y="506">QACT = round to nearest, ties to even, then clip to the stored activation range.</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">A is the current ACT value; B is a trained parameter. Fraction alignment uses exact shifts and extra bits, not early rounding.</tspan><tspan x="750" y="662.5">Each addition returns one converted result; the stage controller owns memory reads and writes. Addition FSM: Page 5.</tspan><tspan x="750" y="684.5">Saturation is recorded but does not stop the frame. No multiplication, division, normalization or dot product is needed here.</tspan></text></svg>
