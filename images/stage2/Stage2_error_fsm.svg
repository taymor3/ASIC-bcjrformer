<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720"><rect width="1500" height="720" fill="white"/><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1678be"/></marker><marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c62828"/></marker><marker id="unit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#438b35"/></marker><marker id="select" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b68112"/></marker><marker id="reg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#75509e"/></marker><marker id="frame" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#374151"/></marker></defs><polyline points="295,282.5 435,282.5" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="540,282.5 680,282.5" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="785,282.5 925,282.5" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1030,282.5 1170,282.5" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><text fill="#263442" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><tspan x="750" y="37.5">Stage 2 failure path — applies from any active state</tspan></text><ellipse cx="242.5" cy="282.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="242.5" y="276.5">Failure</tspan><tspan x="242.5" y="298.5">detected</tspan></text><ellipse cx="487.5" cy="282.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="487.5" y="276.5">Stop new</tspan><tspan x="487.5" y="298.5">requests</tspan></text><ellipse cx="732.5" cy="282.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="732.5" y="265.5">Drain</tspan><tspan x="732.5" y="287.5">accepted</tspan><tspan x="732.5" y="309.5">work</tspan></text><ellipse cx="977.5" cy="282.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="977.5" y="276.5">Hold failed</tspan><tspan x="977.5" y="298.5">completion</tspan></text><ellipse cx="1222.5" cy="282.5" rx="52.5" ry="52.5" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1222.5" y="276.5">Wait for</tspan><tspan x="1222.5" y="298.5">reset</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="755" y="464.5">Failure = memory / protocol error or overflow outside a declared temporary format.</tspan><tspan x="755" y="486.5">Keep handling accepted responses; do not request more reads, additions or writes.</tspan><tspan x="755" y="508.5">Report failure after outstanding work is drained; hold until the frame controller accepts it.</tspan><tspan x="755" y="530.5">Partial X values are invalid. Stage 3 is blocked. A new frame requires reset and reload under the fatal-error policy.</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="651.5">Normal rounding or saturation is not a failure; record the flags and continue.</tspan><tspan x="750" y="673.5">For a child failure, the addition result/error handshake still completes so the Stage 2 controller can drain and report it.</tspan></text></svg>
