e same location.</tspan><tspan x="750" y="662.5">P and E are trained values. Process all L = M × N tokens, including padded ones. One addition block is used twice.</tspan><tspan x="750" y="684.5">Input/output arrows show stored data flow, not a direct live link. Stage 3 waits for all writes. FSM: Page 4; errors: Page 7.</tspan></text><text x="790" y="235" fill="#c62828" font-family="Arial" font-size="13">command / done</text></svg>
