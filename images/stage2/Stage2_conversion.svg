<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720"><rect width="1500" height="720" fill="white"/><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1678be"/></marker><marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c62828"/></marker><marker id="unit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#438b35"/></marker><marker id="select" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b68112"/></marker><marker id="reg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#75509e"/></marker><marker id="frame" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#374151"/></marker></defs><rect x="190" y="75" width="1090" height="505" fill="white" stroke="#374151" stroke-width="2" stroke-dasharray="7 5"/><polyline points="160,150 220,150" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1250,150 1320,150" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="165,338 240,333" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="440,325 520,332" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="750,332 825,350" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="350,385 350,445 890,445 890,375" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="970,332 1040,332" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="1235,332 1320,338" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="1140,175 1140,280" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><text fill="#263442" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><tspan x="750" y="37.5">Round and saturate — bit operations inside the addition block</tspan></text><text fill="#374151" font-family="Arial,sans-serif" font-size="16" text-anchor="start"><tspan x="202" y="98">Round and saturate</tspan></text><rect x="220" y="125" width="1030" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="155">Controlled by the Addition FSM (Page 5)</tspan></text><rect x="20" y="125" width="140" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="90" y="155">Control inputs</tspan></text><rect x="1320" y="125" width="160" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="155">Status capture</tspan></text><rect x="20" y="300" width="145" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="92.5" y="331.5">Wide signed</tspan><tspan x="92.5" y="353.5">sum v</tspan></text><rect x="240" y="280" width="200" height="105" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="340" y="315.5">Shift / bit select</tspan><tspan x="340" y="337.5">q = v &gt;&gt; k</tspan><tspan x="340" y="359.5">guard, sticky, q bit 0</tspan></text><rect x="520" y="290" width="230" height="85" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="635" y="315.5">OR and AND</tspan><tspan x="635" y="337.5">inc = guard AND</tspan><tspan x="635" y="359.5">(sticky OR q bit 0)</tspan></text><rect x="825" y="290" width="145" height="85" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="897.5" y="326.5">Add</tspan><tspan x="897.5" y="348.5">q + inc</tspan></text><rect x="1040" y="280" width="195" height="105" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1137.5" y="315.5">Compare / select</tspan><tspan x="1137.5" y="337.5">min or max or</tspan><tspan x="1137.5" y="359.5">rounded value</tspan></text><rect x="1320" y="300" width="160" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="331.5">ACT result</tspan><tspan x="1400" y="353.5">flags</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="740" y="498">k = fractional bits to remove. Guard is the highest removed bit; sticky is OR of the other removed bits.</tspan><tspan x="740" y="520">Use an arithmetic right shift (signed floor). The increment rule handles negative values and ties to even.</tspan><tspan x="740" y="542">If k = 0: no bits are removed and inc = 0. Keep the carry bit before the min/max comparisons.</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">The Addition controller supplies the controls here; this conversion path does not need a separate controller.</tspan><tspan x="750" y="662.5">Clip only after rounding. Keep rounded-changed and saturated flags separate; log one result at the accepted write.</tspan><tspan x="750" y="684.5">If the incoming format has fewer fractional bits than ACT, sign extend and shift left exactly instead of discarding bits.</tspan></text></svg>
