ze="24" text-anchor="middle"><tspan x="750" y="37.5">Complete inference core</tspan></text><text fill="#374151" font-family="Arial,sans-serif" font-size="16" text-anchor="start"><tspan x="202" y="98">Complete inference core</tspan></text><rect x="220" y="125" width="1030" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="155">Frame controller</tspan></text><rect x="20" y="125" width="140" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="90" y="155">Start / command</tspan></text><rect x="1320" y="125" width="160" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="155">Done / error</tspan></text><rect x="225" y="290" width="175" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="312.5" y="331.5">Stage 1</tspan><tspan x="312.5" y="353.5">Input embedding</tspan></text><rect x="443.75" y="290" width="175" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="531.25" y="331.5">Stage 2</tspan><tspan x="531.25" y="353.5">Position / read</tspan></text><rect x="662.5" y="290" width="175" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="750" y="331.5">Stage 3</tspan><tspan x="750" y="353.5">Encoder × K</tspan></text><rect x="881.25" y="290" width="175" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="968.75" y="331.5">Stage 4</tspan><tspan x="968.75" y="353.5">Final projection</tspan></text><rect x="1100" y="290" width="175" height="95" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1187.5" y="331.5">Stage 5</tspan><tspan x="1187.5" y="353.5">Read aggregation</tspan></text><rect x="20" y="300" width="145" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="92.5" y="331.5">Window features</tspan><tspan x="92.5" y="353.5">and padding mask</tspan></text><rect x="1320" y="300" width="160" height="75" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="331.5">N final logits</tspan><tspan x="1400" y="353.5">ready / valid</tspan></text><rect x="260" y="480" width="950" height="65" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="517.5">Memory access: feature input / learned parameters / working values / saved mask / final output buffer</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">Prepared features + mask → Stage 1 → Stage 2 → Stage 3 → Stage 4 → Stage 5 → buffered valid logits → output transfer.</tspan><tspan x="750" y="662.5">Each stage has its own controller and starts only after the previous stage commits its writes. One frame at a time, B = 1.</tspan><tspan x="750" y="684.5">Shared child diagrams are on their own tabs. Nonlinear arithmetic methods remain black boxes pending review.</tspan></text></svg>
