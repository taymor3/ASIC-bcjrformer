" text-anchor="middle"><tspan x="92.5" y="329">Input values</tspan><tspan x="92.5" y="351">u [F]</tspan></text><rect x="260" y="300" width="160" height="65" fill="white" stroke="#75509e" stroke-width="2"/><text fill="#75509e" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="340" y="337.5">Bias register</tspan></text><rect x="575" y="290" width="235" height="100" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="692.5" y="334">Dot-product block</tspan><tspan x="692.5" y="356">Page 4</tspan></text><rect x="980" y="310" width="220" height="65" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1090" y="347.5">Round / saturate</tspan></text><rect x="1320" y="310" width="160" height="65" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="336.5">Linear results</tspan><tspan x="1400" y="358.5">v [D]</tspan></text><rect x="360" y="480" width="775" height="55" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="747.5" y="512.5">Memory access: inputs / weights / biases / result writes</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="651.5">For each output j: read bias → request one F-term dot → convert → write. Repeat for all D outputs.</tspan><tspan x="750" y="673.5">The linear controller owns result writes. The dot-product block returns a wide sum and has its own controller.</tspan></text><text x="425" y="390" fill="#1678be" font-family="Arial" font-size="13">initial sum</text><text x="700" y="235" fill="#c62828" font-family="Arial" font-size="13">command / result</text></svg>
