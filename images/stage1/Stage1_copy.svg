e" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="795" y="512.5">Memory access: source / destination addresses and responses</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="651.5">Read one value → save it → write it → wait for write confirmation → advance the index.</tspan><tspan x="750" y="673.5">Copy preserves the stored number format. Use F values for loading a window and D values for storing its embedding.</tspan></text></svg>
