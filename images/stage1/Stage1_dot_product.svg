amily="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="651.5">Read A → read B → multiply → add to accumulator → next term. Initialize the accumulator only once per output.</tspan><tspan x="750" y="673.5">Return the wide sum after all terms. This block does not round, saturate or write the linear output.</tspan></text></svg>
