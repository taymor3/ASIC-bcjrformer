<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720"><rect width="1500" height="720" fill="white"/><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1678be"/></marker><marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c62828"/></marker><marker id="unit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#438b35"/></marker><marker id="select" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b68112"/></marker><marker id="reg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#75509e"/></marker><marker id="frame" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#374151"/></marker></defs><rect x="190" y="75" width="1090" height="505" fill="white" stroke="#374151" stroke-width="2" stroke-dasharray="7 5"/><polyline points="160,150 220,150" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1250,150 1320,150" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="165,320 250,305" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="450,305 515,325" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="450,490 480,490 480,385 515,385" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="595,315 660,307" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="595,390 625,390 625,417 660,417" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="795,307 880,315" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="795,417 835,417 835,380 950,380 950,355" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="1025,327 1080,327" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="1240,327 1320,327" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="880,342 850,342 850,550 475,550 475,505 450,505" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="990,355 990,455" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="880,490 810,490 810,535 475,535 475,480 450,480" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="900,300 900,240 555,240 555,295" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="95,470 95,430 300,430 300,340" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="165,503 250,503" fill="none" stroke="#1678be" stroke-width="1.8" marker-end="url(#data)"/><polyline points="535,175 535,295" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="780,175 820,175 820,417 795,417" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><polyline points="1100,175 1260,175 1260,560 1110,560 1110,490 1090,490" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 5"/><text fill="#263442" font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><tspan x="750" y="37.5">Normalization block — reused for length F or D</tspan></text><text fill="#374151" font-family="Arial,sans-serif" font-size="16" text-anchor="start"><tspan x="202" y="98">Normalization</tspan></text><rect x="220" y="125" width="1030" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="735" y="155">Normalization controller</tspan></text><rect x="20" y="125" width="140" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="90" y="155">Start / command</tspan></text><rect x="1320" y="125" width="160" height="50" fill="white" stroke="#c62828" stroke-width="2"/><text fill="#c62828" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="155">Done / error</tspan></text><rect x="20" y="285" width="145" height="70" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="92.5" y="314">Input values</tspan><tspan x="92.5" y="336">a [J]</tspan></text><rect x="250" y="270" width="200" height="70" fill="white" stroke="#75509e" stroke-width="2"/><text fill="#75509e" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="350" y="299">Operand registers</tspan><tspan x="350" y="321">input / gamma / beta</tspan></text><rect x="250" y="455" width="200" height="70" fill="white" stroke="#75509e" stroke-width="2"/><text fill="#75509e" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="350" y="484">Statistics registers</tspan><tspan x="350" y="506">sum / mean / scale</tspan></text><path d="M515 295 L595 311 L595 394 L515 410Z" fill="white" stroke="#b68112" stroke-width="2"/><text fill="#b68112" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="555" y="346.5">Operand</tspan><tspan x="555" y="368.5">select</tspan></text><rect x="660" y="280" width="135" height="55" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="727.5" y="312.5">Add / Subtract</tspan></text><rect x="660" y="390" width="135" height="55" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="727.5" y="422.5">Multiply</tspan></text><rect x="880" y="300" width="145" height="55" fill="white" stroke="#75509e" stroke-width="2"/><text fill="#75509e" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="952.5" y="332.5">Result register</tspan></text><rect x="1080" y="300" width="160" height="55" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1160" y="332.5">Round / saturate</tspan></text><rect x="880" y="455" width="210" height="70" fill="white" stroke="#438b35" stroke-width="2"/><text fill="#438b35" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="985" y="484">Inverse square root</tspan><tspan x="985" y="506">Black box</tspan></text><rect x="20" y="470" width="145" height="65" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="92.5" y="496.5">Memory / constant</tspan><tspan x="92.5" y="518.5">access</tspan></text><rect x="1320" y="295" width="160" height="70" fill="white" stroke="#1678be" stroke-width="2"/><text fill="#1678be" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="1400" y="324">Normalized values</tspan><tspan x="1400" y="346">o [J]</tspan></text><text fill="#263442" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><tspan x="750" y="640.5">J = F or D. The controller selects operations and register loads; the same add/subtract and multiply units are reused.</tspan><tspan x="750" y="662.5">Mean → variance → inverse square root → normalize → gamma / beta → convert and write.</tspan><tspan x="750" y="684.5">The memory-access port supplies parameters and constants; no memory banks are drawn.</tspan></text></svg>
