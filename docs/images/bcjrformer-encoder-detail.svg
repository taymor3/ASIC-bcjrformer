<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title desc"><title id="title">BCJRFormer encoder detail</title><desc id="desc">Pre-norm encoder sequencing with two residuals, head and query attention loops, and exact mapping of controller operations to shared engines. Boxes within stage sequences are operations; all named shared engines are instantiated once.</desc><defs><marker id="64d8ef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64d8ef"/></marker><marker id="64d8ef-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#64d8ef"/></marker><marker id="77e3b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#77e3b0"/></marker><marker id="77e3b0-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#77e3b0"/></marker><marker id="ffc879" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ffc879"/></marker><marker id="ffc879-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#ffc879"/></marker><marker id="beabff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#beabff"/></marker><marker id="beabff-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#beabff"/></marker><marker id="a9bbd1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a9bbd1"/></marker><marker id="a9bbd1-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#a9bbd1"/></marker></defs><rect width="100%" height="100%" fill="#0b111b"/><g font-family="Arial, Helvetica, sans-serif"><text x="50" y="42" fill="#64d8ef" font-size="15" font-weight="700" text-anchor="start">BCJRFORMER  /  STAGE 03</text><text x="50" y="88" fill="#eff5ff" font-size="34" font-weight="700" text-anchor="start">Encoder layer · attention and feed-forward</text><text x="50" y="121" fill="#a9bbd1" font-size="18" font-weight="400" text-anchor="start">Actual controller sequence · K layers · T = M × N tokens · H heads · dₕ = D / H</text><rect x="50" y="158" width="1700" height="85" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="50" y="158" width="4" height="85" rx="2" fill="#77e3b0" stroke="#77e3b0"/><text x="70" y="190" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">encoder_ctrl → layer_ctrl</text><text x="70" y="217" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">Repeat the layer below K times; each phase waits for its child completion and committed writes.</text><text x="50" y="286" fill="#77e3b0" font-size="15" font-weight="700" text-anchor="start">1  PRE-NORM</text><rect x="50" y="306" width="260" height="133" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="50" y="306" width="4" height="133" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="70" y="338" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">LayerNorm₁</text><text x="70" y="365" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">X → U</text><text x="70" y="390" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">all T tokens</text><path d="M310,371 L335,371" fill="none" stroke="#64d8ef" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#64d8ef)"/><text x="335" y="286" fill="#77e3b0" font-size="15" font-weight="700" text-anchor="start">2  ATTENTION</text><rect x="335" y="306" width="260" height="133" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="335" y="306" width="4" height="133" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="355" y="338" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">Multi-head attention</text><text x="355" y="365" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">U → ATTN_OUT</text><text x="355" y="390" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">all heads / queries</text><path d="M595,371 L620,371" fill="none" stroke="#64d8ef" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#64d8ef)"/><text x="620" y="286" fill="#77e3b0" font-size="15" font-weight="700" text-anchor="start">3  RESIDUAL</text><rect x="620" y="306" width="260" height="133" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="620" y="306" width="4" height="133" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="640" y="338" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">Residual add</text><text x="640" y="365" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">X ← X + ATTN_OUT</text><text x="640" y="390" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">all T tokens</text><path d="M880,371 L905,371" fill="none" stroke="#64d8ef" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#64d8ef)"/><text x="905" y="286" fill="#77e3b0" font-size="15" font-weight="700" text-anchor="start">4  PRE-NORM</text><rect x="905" y="306" width="260" height="133" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="905" y="306" width="4" height="133" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="925" y="338" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">LayerNorm₂</text><text x="925" y="365" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">X → U</text><text x="925" y="390" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">all T tokens</text><path d="M1165,371 L1190,371" fill="none" stroke="#64d8ef" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#64d8ef)"/><text x="1190" y="286" fill="#77e3b0" font-size="15" font-weight="700" text-anchor="start">5  FFN</text><rect x="1190" y="306" width="260" height="133" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="1190" y="306" width="4" height="133" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="1210" y="338" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">Feed-forward</text><text x="1210" y="365" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">U[token] → VECTOR</text><text x="1210" y="390" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">one token</text><path d="M1450,371 L1475,371" fill="none" stroke="#64d8ef" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#64d8ef)"/><text x="1475" y="286" fill="#77e3b0" font-size="15" font-weight="700" text-anchor="start">6  RESIDUAL</text><rect x="1475" y="306" width="260" height="133" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="1475" y="306" width="4" height="133" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="1495" y="338" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">Residual add</text><text x="1495" y="365" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">X[token] += VECTOR</text><text x="1495" y="390" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">one token</text><path d="M1605,439 L1605,475 L1320,475 L1320,439" fill="none" stroke="#77e3b0" stroke-width="2" marker-end="url(#77e3b0)"/><text x="1460" y="499" fill="#77e3b0" font-size="16" font-weight="400" text-anchor="middle">repeat phases 5–6 for each token</text><text x="50" y="478" fill="#a9bbd1" font-size="16" font-weight="400" text-anchor="start">Two LayerNorm operations call the same norm engine; two residual phases call the same residual_ctrl.</text><rect x="50" y="538" width="1700" height="365" rx="12" fill="#111d2c" stroke="#31455d"/><text x="75" y="575" fill="#64d8ef" font-size="17" font-weight="700" text-anchor="start">ATTENTION_CTRL  /  EXPANDED PHASE 2</text><text x="75" y="605" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">QKV once → for each head h and query q: score row → softmax → weighted values → output projection once</text><rect x="75" y="645" width="280" height="149" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="75" y="645" width="4" height="149" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="95" y="677" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">qkv_ctrl</text><text x="95" y="704" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">Q → KEY → VALUE</text><text x="95" y="729" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">all T tokens per projection</text><text x="95" y="754" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">Linear(D→D) from U</text><rect x="410" y="645" width="280" height="149" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="410" y="645" width="4" height="149" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="430" y="677" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">score_row_ctrl</text><text x="430" y="704" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">Q[q,h] · KEY[:,h]</text><text x="430" y="729" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">scale by 1 / √dₕ</text><text x="430" y="754" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">→ SCORE row</text><rect x="745" y="645" width="280" height="149" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="745" y="645" width="4" height="149" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="765" y="677" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">softmax_ctrl</text><text x="765" y="704" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">subtract row maximum</text><text x="765" y="729" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">EXP → sum → RECIP</text><text x="765" y="754" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">→ PROB row</text><rect x="1080" y="645" width="280" height="149" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="1080" y="645" width="4" height="149" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="1100" y="677" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">weighted_value_ctrl</text><text x="1100" y="704" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">PROB · VALUE[:,h]</text><text x="1100" y="729" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">→ Z[q,h]</text><rect x="1415" y="645" width="310" height="149" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="1415" y="645" width="4" height="149" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="1435" y="677" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">output_projection_ctrl</text><text x="1435" y="704" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">Z → ATTN_OUT</text><text x="1435" y="729" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">Linear(D→D)</text><text x="1435" y="754" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">all T tokens</text><path d="M355,718 L410,718" fill="none" stroke="#64d8ef" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#64d8ef)"/><path d="M690,718 L745,718" fill="none" stroke="#64d8ef" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#64d8ef)"/><path d="M1025,718 L1080,718" fill="none" stroke="#64d8ef" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#64d8ef)"/><path d="M1360,718 L1415,718" fill="none" stroke="#64d8ef" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#64d8ef)"/><path d="M1220,794 L1220,834 L550,834 L550,794" fill="none" stroke="#77e3b0" stroke-width="2" marker-end="url(#77e3b0)"/><text x="880" y="863" fill="#77e3b0" font-size="16" font-weight="400" text-anchor="middle">H × T row iterations; scratch rows are reused after each weighted-value result</text><rect x="50" y="930" width="800" height="280" rx="12" fill="#111d2c" stroke="#31455d"/><text x="75" y="968" fill="#64d8ef" font-size="17" font-weight="700" text-anchor="start">FFN_CTRL  /  EXPANDED PHASE 5</text><rect x="75" y="1008" width="225" height="105" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="75" y="1008" width="4" height="105" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="95" y="1040" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">Linear D→4D</text><text x="95" y="1067" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">U → FFN_HIDDEN</text><rect x="340" y="1008" width="225" height="105" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="340" y="1008" width="4" height="105" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="360" y="1040" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">Taylor GELU</text><text x="360" y="1067" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">hidden: signed32/F22</text><rect x="605" y="1008" width="220" height="105" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="605" y="1008" width="4" height="105" rx="2" fill="#64d8ef" stroke="#64d8ef"/><text x="625" y="1040" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">Linear 4D→D</text><text x="625" y="1067" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">→ VECTOR</text><path d="M300,1060 L340,1060" fill="none" stroke="#64d8ef" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#64d8ef)"/><path d="M565,1060 L605,1060" fill="none" stroke="#64d8ef" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#64d8ef)"/><text x="75" y="1150" fill="#a9bbd1" font-size="16" font-weight="400" text-anchor="start">GELU → hidden: signed32/F22, preserving the function error bound.</text><text x="75" y="1178" fill="#a9bbd1" font-size="16" font-weight="400" text-anchor="start">Next linear accumulates signed64/F32; its output converts to F10.</text><rect x="880" y="930" width="870" height="280" rx="12" fill="#111d2c" stroke="#31455d"/><text x="905" y="968" fill="#64d8ef" font-size="17" font-weight="700" text-anchor="start">OPERATIONS → SHARED PHYSICAL ENGINES</text><text x="905" y="1005" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">LayerNorm₁,₂ → norm_switch → layernorm_ctrl → rsqrt_unit</text><text x="905" y="1036" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">QKV / output projection / FFN → linear_switch → linear_ctrl</text><text x="905" y="1067" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">linear_ctrl / score / weighted → dot_switch → dot_engine → mac_unit</text><text x="905" y="1098" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">softmax_ctrl → exp_unit + reciprocal_switch → reciprocal_unit</text><text x="905" y="1129" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">ffn_ctrl → gelu_unit; residual_ctrl performs local add / convert</text><text x="905" y="1160" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">All tensor reads / writes use the shared memory_fabric</text><path d="M450,1210 L450,1250" fill="none" stroke="#ffc879" stroke-width="2" marker-end="url(#ffc879)" marker-start="url(#ffc879-start)"/><path d="M1315,1210 L1315,1250" fill="none" stroke="#ffc879" stroke-width="2" marker-end="url(#ffc879)" marker-start="url(#ffc879-start)"/><rect x="50" y="1250" width="1700" height="78" rx="12" fill="#111d2c" stroke="#31455d"/><rect x="50" y="1250" width="4" height="78" rx="2" fill="#ffc879" stroke="#ffc879"/><text x="70" y="1282" fill="#eff5ff" font-size="22" font-weight="700" text-anchor="start">memory_fabric ↔ parameter_mem / scratch_mem</text><text x="70" y="1309" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">Tensor arrows above are logical dependencies through banks, rather than direct point-to-point datapaths.</text><text x="50" y="1365" fill="#a9bbd1" font-size="17" font-weight="400" text-anchor="start">Dashed cyan = tensor dependency     Green = control / loop     Gold = memory     All functional arithmetic is fixed-point.</text><text x="50" y="1393" fill="#a9bbd1" font-size="16" font-weight="400" text-anchor="start">Mask handling and empty-row behavior follow controller contracts. STATIC_MASK is unsupported by the current core configuration.</text></g></svg>