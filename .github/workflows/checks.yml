name: Structural and numerical checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check.py smoke
      - run: python scripts/check.py numerics
      - run: python scripts/check.py regressions
      - name: Complete-core precision integration
        run: |
          python rtl/tests/build_cycle_netlist.py precision
          node rtl/tests/run_complete_cycle.cjs precision
